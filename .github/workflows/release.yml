name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to create the release

jobs:
  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
      - name: 🧰 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true
          cache: true
      - name: 📐 gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt issues:"
            echo "$unformatted"
            exit 1
          fi
      - name: 🔎 go vet
        run: go vet ./...
      - name: 🧪 go test -race
        run: go test -race -count=1 -timeout 300s ./...
      - name: 🛡️ govulncheck
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  publish:
    name: 🚀 Publish release
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so the release-notes generator can compare against the previous tag
      - name: 🧾 Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: 🏷️ Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            sbom.spdx.json
