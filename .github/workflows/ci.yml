name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
      - name: 🧰 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: 📐 gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt issues:"
            echo "$unformatted"
            exit 1
          fi
      - name: 🔎 go vet (main module)
        run: go vet ./...
      - name: 🔎 go vet (integration)
        working-directory: tests/integration
        run: go vet ./...
      - name: 🧹 staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: 'latest'
          install-go: false
      - name: 🧪 Dep graph hygiene (main module has no server deps)
        run: |
          if go list -m all | grep -E 'go.etcd.io/etcd/server'; then
            echo "::error::Main module dep graph contains etcd/server — must stay in tests/integration only"
            exit 1
          fi

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # go.mod floor is 1.25; older toolchains can't build the transitive
        # grpc/etcd graph in 2026. See README "Why go 1.25" for rationale.
        go: ['1.25']
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
      - name: 🧰 Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: 🧪 go test (main module)
        run: go test -race -count=1 -timeout 300s -coverprofile=coverage.out ./...
      - name: 🧪 go test (integration)
        working-directory: tests/integration
        run: go test -race -count=1 -timeout 300s ./...
      - name: 📊 Upload coverage
        if: matrix.go == '1.25'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  vuln:
    name: 🛡️ Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
      - name: 🧰 Setup Go (latest stable)
        # Pin to the absolute latest stable Go so govulncheck scans
        # against the most recently patched standard library. The go.mod
        # `go` directive (consumer floor) is intentionally lower.
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true
          cache: true
      - name: 🛡️ govulncheck (main module)
        env:
          # Force Go to honor the `toolchain` directive in go.mod, auto-
          # downloading a newer patch when the runner's stable build lags.
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: 🛡️ govulncheck (integration)
        env:
          GOTOOLCHAIN: auto
        working-directory: tests/integration
        run: govulncheck ./...

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
      - name: 🧰 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: 🏗️ go build (main module)
        run: go build -trimpath ./...
      - name: 🏗️ go build (integration)
        working-directory: tests/integration
        run: go build -trimpath ./...
