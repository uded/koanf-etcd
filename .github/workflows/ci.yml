name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
      - name: 🧰 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: 📐 gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt issues:"
            echo "$unformatted"
            exit 1
          fi
      - name: 🔎 go vet
        run: go vet ./...
      - name: 🧹 staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: 'latest'
          install-go: false

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24', '1.25']
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
      - name: 🧰 Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: 🧪 go test -race
        run: go test -race -count=1 -timeout 300s -coverprofile=coverage.out ./...
      - name: 📊 Upload coverage
        if: matrix.go == '1.25'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  vuln:
    name: 🛡️ Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
      - name: 🧰 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: 🛡️ govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
      - name: 🧰 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: 🏗️ go build
        run: go build -trimpath ./...
